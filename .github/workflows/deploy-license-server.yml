name: Deploy Jackdaw License Server

# Сервис лицензий работает на VPS под пользователем jackdaw-license.
# Деплой идёт от отдельного пользователя с ограниченным sudo (см.
# license_server/README.md): он загружает app.py в свою папку, а sudo
# разрешает только установку этого файла и перезапуск одного сервиса.
# Миграции базы этим workflow не применяются, их запускают вручную.

on:
  push:
    branches: [main]
    paths:
      - 'license_server/**'
      - '.github/workflows/deploy-license-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-server-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r license_server/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s license_server/tests -v

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.LICENSE_DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.LICENSE_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.LICENSE_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.LICENSE_DEPLOY_USER }}
      TARGET_PATH: ${{ vars.LICENSE_DEPLOY_PATH || '/opt/jackdaw-license/app.py' }}
      SERVICE_USER: ${{ vars.LICENSE_SERVICE_USER || 'jackdaw-license' }}
    steps:
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::License server deploy is not configured, skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Setup Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure SSH
        if: steps.config.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/license_deploy
          chmod 600 ~/.ssh/license_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Upload app.py
        if: steps.config.outputs.ready == 'true'
        run: |
          ssh_opts="-i $HOME/.ssh/license_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes"
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/license-incoming"'
          scp $ssh_opts license_server/app.py "$DEPLOY_USER@$DEPLOY_HOST:license-incoming/app.py"
      - name: Install and restart service
        if: steps.config.outputs.ready == 'true'
        # sudo -n: если право не выдано, команда падает, а не ждёт пароль.
        run: |
          ssh -i "$HOME/.ssh/license_deploy" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; sudo -n /usr/bin/install -o $SERVICE_USER -g $SERVICE_USER -m 0644 \"\$HOME/license-incoming/app.py\" $TARGET_PATH; sudo -n /usr/bin/systemctl restart jackdaw-license; sleep 2; systemctl is-active jackdaw-license"
      - name: Verify live admin page
        if: steps.config.outputs.ready == 'true'
        run: |
          python -m pip install -q -r license_server/requirements.txt
          expected="$(python -c "import sys; sys.path.insert(0, '.'); sys.stdout.write(__import__('license_server.app', fromlist=['ADMIN_HTML']).ADMIN_HTML)" | sha256sum | cut -d' ' -f1)"
          actual="$(curl -fsS "https://license.jackdaw-mail.pro/admin/" | sha256sum | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::license.jackdaw-mail.pro/admin/ does not serve the deployed page"
            exit 1
          fi
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/license_deploy
