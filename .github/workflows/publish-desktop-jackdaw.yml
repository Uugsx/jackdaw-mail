name: Jackdaw Mail Publish Desktop Update

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: GitHub Release type (use prerelease for -dev builds)
        options:
          - prerelease
          - release
        default: prerelease
      platform:
        type: choice
        description: Build mac, windows, or both (single-OS keeps other platform OTA metadata via carry-forward)
        options:
          - both
          - mac
          - windows
        default: both
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'desktop/**'
      - '.github/workflows/check-desktop.yml'
      - '.github/workflows/publish-desktop-jackdaw.yml'

concurrency:
  group: publish-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/check-desktop.yml
    permissions:
      contents: read

  prepare:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ota_build_suffix: ${{ steps.ota_suffix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - name: OTA dev version suffix
        id: ota_suffix
        if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Create release tag and GitHub prerelease
        if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ steps.ota_suffix.outputs.value }}
        run: |
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          # Cancelled builds leave empty prereleases that break electron-updater (no latest.yml).
          gh api "repos/Uugsx/jackdaw-mail/releases?per_page=100" --jq '.[] | select((.assets | length) == 0) | .tag_name' | while read -r EMPTY; do
            [ -z "$EMPTY" ] && continue
            echo "Removing empty release $EMPTY"
            gh release delete "$EMPTY" --repo Uugsx/jackdaw-mail -y --cleanup-tag || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "$TAG" --force
          gh release delete "$TAG" --repo Uugsx/jackdaw-mail -y 2>/dev/null || true
          gh release create "$TAG" --repo Uugsx/jackdaw-mail --prerelease \
            --title "${BASE}-dev.${OTA_BUILD_SUFFIX}" \
            --notes "Jackdaw Mail desktop prerelease."

  mac:
    needs: prepare
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'mac'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: bash jackdaw-brand.sh
        working-directory: app/build
        shell: bash
        env:
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
      - run: sudo -H pip install setuptools
      - run: cd app; yarn install
      - run: cd lib; yarn install
      - run: cd desktop; yarn install
      - run: cd desktop/backend; yarn install
      - run: |
          mkdir -p ~/private_keys/
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_"$APPLE_API_KEY_ID".p8
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      - name: OAuth2 secrets stub for CI
        run: cp OAuth2Secrets.local.example.ts OAuth2Secrets.user.ts
        working-directory: app/logic/Auth
        shell: bash
      - run: cd desktop; yarn run build:release:mac
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'release'
        env: &mac_env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_API_KEY: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=32768'
      - if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        shell: bash
        # GitHub иногда отвечает на список выпусков пустым массивом: electron-builder не находит
        # выпуск от prepare, пытается создать его и падает с 422 already_exists. Повтор помогает,
        # уже загруженные файлы electron-builder перезаписывает.
        run: |
          cd desktop
          for attempt in 1 2 3 4; do
            yarn run build:publish:prerelease:mac && exit 0
            echo "::warning::Публикация, попытка $attempt не удалась, повторяю"
            sleep 20
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=32768'

  windows:
    needs: prepare
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: bash fix-installer-filenames.sh
        working-directory: app/build
        shell: bash
      - run: bash jackdaw-brand.sh
        working-directory: app/build
        shell: bash
        env:
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
      - run: cd app; yarn install
      - run: cd lib; yarn install
      - run: cd desktop; yarn install
      - run: cd desktop/backend; yarn install
      - name: OAuth2 secrets stub for CI
        run: cp OAuth2Secrets.local.example.ts OAuth2Secrets.user.ts
        working-directory: app/logic/Auth
        shell: bash
      - run: cd desktop; yarn run build:release:win
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'release'
        env: &win_env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=32768'
      - if: github.event_name == 'push' || inputs.release_type == 'prerelease'
        shell: bash
        # GitHub иногда отвечает на список выпусков пустым массивом: electron-builder не находит
        # выпуск от prepare, пытается создать его и падает с 422 already_exists. Повтор помогает,
        # уже загруженные файлы electron-builder перезаписывает.
        run: |
          cd desktop
          for attempt in 1 2 3 4; do
            yarn run build:publish:prerelease:win && exit 0
            echo "::warning::Публикация, попытка $attempt не удалась, повторяю"
            sleep 20
          done
          exit 1
        env: *win_env

  carry-forward:
    needs: [prepare, mac, windows]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.platform == 'mac' || inputs.platform == 'windows') &&
          (
            (inputs.platform == 'mac' && needs.mac.result == 'success') ||
            (inputs.platform == 'windows' && needs.windows.result == 'success')
          )
        ) ||
        (
          (github.event_name == 'push' || inputs.platform == 'both') &&
          needs.mac.result == 'success' &&
          needs.windows.result != 'success'
        ) ||
        (
          (github.event_name == 'push' || inputs.platform == 'both') &&
          needs.windows.result == 'success' &&
          needs.mac.result != 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Carry forward other platform OTA assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        run: |
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILT="${{ inputs.platform }}"
          elif [ "${{ needs.mac.result }}" = "success" ] && [ "${{ needs.windows.result }}" != "success" ]; then
            BUILT="mac"
          else
            BUILT="windows"
          fi
          bash app/build/ota-carry-forward.sh "$TAG" "$BUILT" Uugsx/jackdaw-mail

  finalize:
    needs: [prepare, mac, windows, carry-forward]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.mac.result == 'success' || needs.mac.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.carry-forward.result == 'success' || needs.carry-forward.result == 'skipped') &&
      (needs.mac.result == 'success' || needs.windows.result == 'success') &&
      (github.event_name == 'push' || inputs.release_type == 'prerelease')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Clean GitHub release description and dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        run: |
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          IDS=$(gh api "repos/Uugsx/jackdaw-mail/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          KEEP=$(gh api "repos/Uugsx/jackdaw-mail/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"$TAG\")] | max_by(.assets | length) | .id // empty")
          for ID in $IDS; do
            if [ "$ID" != "$KEEP" ]; then
              gh api -X DELETE "repos/Uugsx/jackdaw-mail/releases/$ID"
            fi
          done
          if [ -n "$KEEP" ]; then
            gh api -X PATCH "repos/Uugsx/jackdaw-mail/releases/$KEEP" \
              -f body="Jackdaw Mail desktop prerelease." \
              -f name="${BASE}-dev.${OTA_BUILD_SUFFIX}"
          fi
      - name: Remove other-version assets of a rebuilt platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        # Если сборка платформы упала, carry-forward кладёт её файлы прошлой версии,
        # а перезапущенная сборка добавляет новые рядом. Старые версии приложения
        # берут первый DMG и снова ставят себя же. Файлы прошлой версии удаляются,
        # только когда для этой платформы уже есть установщик текущей версии.
        run: |
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          VERSION="${BASE}-dev.${OTA_BUILD_SUFFIX}"
          TAG="v${VERSION}"
          NAMES=$(gh release view "$TAG" --repo Uugsx/jackdaw-mail --json assets -q '.assets[].name' 2>/dev/null || true)
          remove_stale() {
            echo "$NAMES" | grep -E "$1" | grep -v -F "$VERSION" | while read -r NAME; do
              [ -n "$NAME" ] || continue
              echo "Removing stale asset $NAME"
              gh release delete-asset "$TAG" "$NAME" --repo Uugsx/jackdaw-mail -y
            done
          }
          if echo "$NAMES" | grep -qx "jackdaw-mail-${VERSION}.dmg"; then
            remove_stale '(\.dmg|\.dmg\.blockmap|-mac\.zip|-mac\.zip\.blockmap|\.pkg)$'
          fi
          if echo "$NAMES" | grep -qx "jackdaw-mail-${VERSION}-setup.exe"; then
            remove_stale '(-setup\.exe|-setup\.exe\.blockmap|\.msi)$'
          fi

  # Зеркало обновлений на VPS (jackdaw-mail.pro/updates/): быстрее CDN GitHub.
  # Не часть критического пути: упавшее зеркало не ломает выпуск, клиент тогда
  # качает с GitHub. Нужны секреты UPDATES_MIRROR_SSH_KEY, UPDATES_MIRROR_KNOWN_HOSTS
  # и переменные UPDATES_MIRROR_HOST, UPDATES_MIRROR_USER; пока не заданы — шаг пропускается.
  # Зеркало платформы сразу после её сборки (см. ota-mirror-sync.sh): манифест на GitHub
  # появляется раньше конца всего выпуска. Итоговый job mirror — страховка и очистка.
  mirror-mac:
    needs: [prepare, mac]
    if: |
      always() &&
      needs.mac.result == 'success' &&
      (github.event_name == 'push' || inputs.release_type == 'prerelease')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: updates-mirror-mac
      cancel-in-progress: false
    env:
      MIRROR_SSH_KEY: ${{ secrets.UPDATES_MIRROR_SSH_KEY }}
      MIRROR_KNOWN_HOSTS: ${{ secrets.UPDATES_MIRROR_KNOWN_HOSTS }}
      MIRROR_HOST: ${{ vars.UPDATES_MIRROR_HOST }}
      MIRROR_USER: ${{ vars.UPDATES_MIRROR_USER }}
    steps:
      - uses: actions/checkout@v6
      - name: Sync release assets to the update mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        run: |
          if [ -z "$MIRROR_SSH_KEY" ] || [ -z "$MIRROR_KNOWN_HOSTS" ] || [ -z "$MIRROR_HOST" ] || [ -z "$MIRROR_USER" ]; then
            echo "::warning::Update mirror is not configured, skipping."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/updates_mirror
          chmod 600 ~/.ssh/updates_mirror
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > ~/.ssh/updates_mirror_known_hosts
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          export MIRROR_SSH_KEY_FILE=~/.ssh/updates_mirror MIRROR_KNOWN_HOSTS_FILE=~/.ssh/updates_mirror_known_hosts
          bash app/build/ota-mirror-sync.sh "$TAG" Uugsx/jackdaw-mail mac
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/updates_mirror ~/.ssh/updates_mirror_known_hosts

  mirror-win:
    needs: [prepare, windows]
    if: |
      always() &&
      needs.windows.result == 'success' &&
      (github.event_name == 'push' || inputs.release_type == 'prerelease')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: updates-mirror-win
      cancel-in-progress: false
    env:
      MIRROR_SSH_KEY: ${{ secrets.UPDATES_MIRROR_SSH_KEY }}
      MIRROR_KNOWN_HOSTS: ${{ secrets.UPDATES_MIRROR_KNOWN_HOSTS }}
      MIRROR_HOST: ${{ vars.UPDATES_MIRROR_HOST }}
      MIRROR_USER: ${{ vars.UPDATES_MIRROR_USER }}
    steps:
      - uses: actions/checkout@v6
      - name: Sync release assets to the update mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        run: |
          if [ -z "$MIRROR_SSH_KEY" ] || [ -z "$MIRROR_KNOWN_HOSTS" ] || [ -z "$MIRROR_HOST" ] || [ -z "$MIRROR_USER" ]; then
            echo "::warning::Update mirror is not configured, skipping."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/updates_mirror
          chmod 600 ~/.ssh/updates_mirror
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > ~/.ssh/updates_mirror_known_hosts
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          export MIRROR_SSH_KEY_FILE=~/.ssh/updates_mirror MIRROR_KNOWN_HOSTS_FILE=~/.ssh/updates_mirror_known_hosts
          bash app/build/ota-mirror-sync.sh "$TAG" Uugsx/jackdaw-mail win
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/updates_mirror ~/.ssh/updates_mirror_known_hosts

  mirror:
    needs: [prepare, mac, windows, carry-forward, finalize]
    if: |
      always() &&
      needs.finalize.result == 'success' &&
      (github.event_name == 'push' || inputs.release_type == 'prerelease')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: updates-mirror
      cancel-in-progress: false
    env:
      MIRROR_SSH_KEY: ${{ secrets.UPDATES_MIRROR_SSH_KEY }}
      MIRROR_KNOWN_HOSTS: ${{ secrets.UPDATES_MIRROR_KNOWN_HOSTS }}
      MIRROR_HOST: ${{ vars.UPDATES_MIRROR_HOST }}
      MIRROR_USER: ${{ vars.UPDATES_MIRROR_USER }}
    steps:
      - uses: actions/checkout@v6
      - name: Sync release assets to the update mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        run: |
          if [ -z "$MIRROR_SSH_KEY" ] || [ -z "$MIRROR_KNOWN_HOSTS" ] || [ -z "$MIRROR_HOST" ] || [ -z "$MIRROR_USER" ]; then
            echo "::warning::Update mirror is not configured, skipping."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/updates_mirror
          chmod 600 ~/.ssh/updates_mirror
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > ~/.ssh/updates_mirror_known_hosts
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          export MIRROR_SSH_KEY_FILE=~/.ssh/updates_mirror MIRROR_KNOWN_HOSTS_FILE=~/.ssh/updates_mirror_known_hosts
          bash app/build/ota-mirror-sync.sh "$TAG" Uugsx/jackdaw-mail
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/updates_mirror ~/.ssh/updates_mirror_known_hosts

  cleanup-empty-release:
    needs: [prepare, mac, windows, carry-forward, finalize]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Remove empty prerelease after cancelled or failed build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_BUILD_SUFFIX: ${{ needs.prepare.outputs.ota_build_suffix }}
        run: |
          BASE=$(node -p "require('./app/package.json').version.replace(/-dev.*/, '')")
          TAG="v${BASE}-dev.${OTA_BUILD_SUFFIX}"
          ASSETS=$(gh release view "$TAG" --repo Uugsx/jackdaw-mail --json assets -q '.assets | length' 2>/dev/null || echo 0)
          if [ "$ASSETS" = "0" ]; then
            echo "Deleting empty release $TAG (no OTA assets — blocks updaters)"
            gh release delete "$TAG" --repo Uugsx/jackdaw-mail -y --cleanup-tag
          else
            echo "Release $TAG has $ASSETS asset(s); keeping"
          fi
