name: Test Jackdaw Call Server

# Только тесты. Развёртывание сервиса звонков выполняется вручную (call_server/README.md).

on:
  push:
    paths:
      - 'call_server/**'
      - '.github/workflows/test-call-server.yml'
  pull_request:
    paths:
      - 'call_server/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r call_server/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s call_server/tests -v
