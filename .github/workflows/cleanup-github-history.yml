name: Cleanup old GitHub history

on:
  workflow_run:
    workflows:
      - Jackdaw Mail Publish Desktop Update
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Remove old completed Actions runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_PUBLISH_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          CURRENT_CLEANUP_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' |
            while IFS=$'\t' read -r RUN_ID CREATED_AT; do
              [ -z "$RUN_ID" ] && continue
              if [ "$RUN_ID" = "$CURRENT_PUBLISH_RUN_ID" ] || [ "$RUN_ID" = "$CURRENT_CLEANUP_RUN_ID" ]; then
                echo "Keeping current run $RUN_ID ($CREATED_AT)"
                continue
              fi
              echo "Deleting completed Actions run $RUN_ID ($CREATED_AT)"
              gh api -X DELETE "repos/$REPOSITORY/actions/runs/$RUN_ID"
            done

      # Каналы обновлений (docs/systems/desktop-build/ota-jackdaw.md): нельзя оставлять только
      # самый новый выпуск — он пробный, и основной канал (latest) остался бы без выпуска.
      # Оставляем выпуск основного канала, два прошлых (для rollback) и всё, что новее
      # основного (пробные, остановленные, незаконченные черновики).
      - name: Keep main channel, rollback targets and pilot releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          KEEP_PREVIOUS_STABLE: 2
        shell: bash
        run: |
          set -euo pipefail
          STABLE=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$STABLE" ]; then
            echo "No main-channel (latest) release found; leaving releases and tags untouched."
            exit 0
          fi
          ver() { printf '%s' "${1#v}"; }
          newer() { [ "$(ver "$1")" != "$(ver "$2")" ] && [ "$(printf '%s\n%s\n' "$(ver "$1")" "$(ver "$2")" | sort -V | tail -n 1)" = "$(ver "$1")" ]; }
          RELEASES=$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, (.prerelease | tostring), ((.assets | length) | tostring)] | @tsv')
          PREVIOUS=$(printf '%s\n' "$RELEASES" | awk -F'\t' '$2 == "false" && $3 > 0 { print $1 }' |
            while read -r TAG; do
              if [ -n "$TAG" ] && newer "$STABLE" "$TAG"; then echo "$TAG"; fi
            done | sort -V | tail -n "$KEEP_PREVIOUS_STABLE")
          echo "Main channel: $STABLE; rollback targets: $(echo $PREVIOUS)"
          printf '%s\n' "$RELEASES" | while IFS=$'\t' read -r TAG PRE ASSETS; do
            [ -z "$TAG" ] && continue
            if [ "$TAG" = "$STABLE" ] || newer "$TAG" "$STABLE" || printf '%s\n' "$PREVIOUS" | grep -qxF "$TAG"; then
              echo "Keeping $TAG"
              continue
            fi
            echo "Deleting old release and tag: $TAG"
            gh release delete "$TAG" --repo "$REPOSITORY" --yes --cleanup-tag
          done
