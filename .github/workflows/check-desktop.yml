name: Проверки desktop

on:
  workflow_call:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "desktop/**"
      - ".github/workflows/check-desktop.yml"
      - ".github/workflows/publish-desktop-jackdaw.yml"
      - ".github/workflows/promote-desktop-jackdaw.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false
      # Lock-файлы не коммитятся в этом репозитории, поэтому используем npm install.
      # У svelte-navigator устаревший postinstall, который предполагает наличие
      # не публикуемых вместе с пакетом devDependencies (is-ci и husky).
      - run: npm install --legacy-peer-deps --ignore-scripts
        working-directory: app
      - run: npm install
        working-directory: lib
      - run: npm install --legacy-peer-deps
        working-directory: desktop
      - run: npm install
        working-directory: desktop/backend
      # Lock-файлов нет, поэтому каждая сборка берёт свежие версии зависимостей:
      # проверяем подписи реестра npm, чтобы подменённый пакет не попал в выпуск.
      - name: Подписи пакетов npm
        run: |
          for dir in app lib desktop desktop/backend; do
            (cd "$dir" && npm audit signatures)
          done
      - name: Тестовая конфигурация OAuth
        run: cp OAuth2Secrets.local.example.ts OAuth2Secrets.user.ts
        working-directory: app/logic/Auth
      - name: Каналы обновлений (пробный и основной)
        run: bash .github/scripts/test-ota-channel/run.sh
      - name: Регрессионные и интеграционные тесты
        run: npm run test:regression
        working-directory: app
      # Сборка Vite держится около лимита кучи Node по умолчанию (~4 ГБ)
      # и падает с OOM; у раннера 16 ГБ ОЗУ, поэтому даём запас.
      - name: Сборка frontend
        run: npm run build
        working-directory: app
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
      - name: Сборка desktop
        run: npm run build
        working-directory: desktop
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
