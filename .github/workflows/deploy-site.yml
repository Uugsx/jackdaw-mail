name: Deploy Jackdaw Mail Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # jackdaw-mail.pro раздаётся с собственного VPS, а не с GitHub Pages.
  # Нужны секреты SITE_DEPLOY_SSH_KEY, SITE_DEPLOY_KNOWN_HOSTS и переменные
  # SITE_DEPLOY_HOST, SITE_DEPLOY_USER, SITE_DEPLOY_PATH. Пока они не заданы,
  # шаги копирования пропускаются, и workflow не падает.
  deploy-vps:
    runs-on: ubuntu-latest
    concurrency:
      group: site-vps
      cancel-in-progress: false
    env:
      SSH_KEY: ${{ secrets.SITE_DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.SITE_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.SITE_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.SITE_DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.SITE_DEPLOY_PATH }}
    steps:
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::warning::VPS deploy is not configured, skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Configure SSH
        if: steps.config.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/site_deploy
          chmod 600 ~/.ssh/site_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Upload site
        if: steps.config.outputs.ready == 'true'
        # Без --delete: файлы на сервере, которых нет в site/, не удаляются.
        run: |
          rsync -rlptvz --checksum \
            -e "ssh -i ~/.ssh/site_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Verify live site
        if: steps.config.outputs.ready == 'true'
        run: |
          expected="$(sha256sum site/index.html | cut -d' ' -f1)"
          actual="$(curl -fsS "https://jackdaw-mail.pro/?deploy=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::jackdaw-mail.pro does not serve the deployed index.html"
            exit 1
          fi
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/site_deploy
